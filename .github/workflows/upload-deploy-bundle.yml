# Качва архив на кода в Supabase (таблица deploy_bundle), откъдето
# Vercel билдът го тегли. Ползва се само по време на деплой — политиките
# за anon достъп до таблицата се отварят и затварят около деплоя.
name: upload-deploy-bundle

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload bundle
        run: |
          set -euo pipefail
          printf 'NEXT_PUBLIC_SUPABASE_URL=https://uvvwchyylyryozxfmkdg.supabase.co\nNEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_uBmTOEuEf3Iqr4Zn1ARMAQ_JVl_M6AW\n' > .env.production
          tar czf /tmp/bundle.tgz --exclude=.git --exclude=.github .
          MD5=$(md5sum /tmp/bundle.tgz | cut -d' ' -f1)
          B64=$(base64 -w0 /tmp/bundle.tgz)
          jq -n --arg d "$B64" --arg m "$MD5" '{id: 1, data: $d, md5: $m}' > /tmp/payload.json
          curl -sf -X POST "https://uvvwchyylyryozxfmkdg.supabase.co/rest/v1/deploy_bundle" \
            -H "apikey: sb_publishable_uBmTOEuEf3Iqr4Zn1ARMAQ_JVl_M6AW" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d @/tmp/payload.json
          echo "uploaded md5=$MD5 size=$(stat -c%s /tmp/bundle.tgz)"
